<!-- favorite-movies.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Избранные фильмы</title>
</head>

<body>
    <div th:fragment="movies (items, totalPages, currentPage)">
        <div th:if="${#lists.isEmpty(items)}">
            <p>В избранных фильмах ничего нет.</p>
        </div>
        <div th:unless="${#lists.isEmpty(items)}">
            <ul>
                <li th:each="movie : ${items}">
                    <span th:text="${movie.name}">Название фильма</span>
                </li>
            </ul>
        </div>
        <!-- Пагинация, если необходима -->
    </div>
</body>

</html>
