<!DOCTYPE html>
<html lang="ru" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{default}">

<body>
    <th:block th:fragment="movies (items, totalPages, currentPage)">
        <th:block th:switch="${items.size()}">
            <h2 th:case="0">Данные отсутствуют</h2>
            <th:block th:case="*">
                <form th:action="@{/}" method="get" class="row mt-2">
                    <div class="col-sm-10">
                        <input type="hidden" th:name="page" th:value="${currentPage}">
                        <select th:name="categorieId" id="categorieId" class="form-select">
                            <option selected value="">Фильтр по категории</option>
                            <option th:each="categorie : ${categories}" th:value="${categorie.id}"
                                th:selected="${categorie.id==categorieId}">
                                [[${categorie.name}]]
                            </option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary col-sm-2">Показать</button>
                </form>
                <div class="row mt-2">
                    <div class="col-md-4" th:each="movie : ${items}">
                        <div class="card mb-4 shadow-sm">
                            <div class="card-body">
                                <img src="https://via.placeholder.com/100x150" class="card-img-top" alt="...">
                                <h5 class="card-title" th:text="${movie.name}"></h5>
                                <p class="card-text" th:text="${movie.description}"></p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <small class="text-muted" th:text="${movie.duration}"></small>
                                    <form th:action="@{/user-movies/add-to-favorites}" method="post">
                                        <input type="hidden" th:name="movieId" th:value="${movie.id}">
                                        <button type="submit" class="btn btn-outline-primary">В избранное</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </th:block>
            <th:block th:replace="~{ pagination :: pagination (
                                        url='',
                                        totalPages=${totalPages},
                                        currentPage=${currentPage}) }" />
        </th:block>
    </th:block>

</body>

</html>
