<!DOCTYPE html>
<html lang="ru" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{default}">

<head>
    <title>Типы заказов</title>
</head>

<body>
    <main layout:fragment="content">
        <th:block th:switch="${items.size()}">
            <h2 th:case="0">Данные отсутствуют</h2>
            <th:block th:case="*">
                <h2>Типы заказов</h2>
                <div>
                    <a th:href="@{/admin/movies/edit/(page=${page})}" class="btn btn-primary">Добавить фильм</a>
                </div>
                <table class="table">
                    <caption></caption>
                    <thead>
                        <tr>
                            <th scope="col" class="w-10">ID</th>
                            <th scope="col" class="w-auto">Название</th>
                            <th scope="col" class="w-auto">Жанр</th>
                            <th scope="col" class="w-auto">Описание</th>
                            <th scope="col" class="w-10">Длительность</th>
                            <th scope="col" class="w-10">Изображение</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="movie : ${items}">
                            <th scope="row" th:text="${movie.id}"></th>
                            <td th:text="${movie.name}"></td>
                            <td th:text="${movie.description}"></td>
                            <td th:text="${movie.duration}"></td>
                            <td th:text="${movie.categorieName}"></td>
                            <td th:text="${movie.image}"></td>
                            <td>
                                <form th:action="@{/admin/movies/edit/{id}(id=${movie.id})}" method="get">
                                    <input type="hidden" th:name="page" th:value="${page}">
                                    <button type="submit" class="btn btn-link button-link">Редактировать</button>
                                </form>
                            </td>
                            <td>
                                <form th:action="@{/admin/movies/delete/{id}(id=${movie.id})}" method="post">
                                    <input type="hidden" th:name="page" th:value="${page}">
                                    <button type="submit" class="btn btn-link button-link"
                                        onclick="return confirm('Вы уверены?')">Удалить</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </th:block>
            <th:block th:replace="~{ pagination :: pagination (
                                url=${'admin/movies'},
                                totalPages=${totalPages},
                                currentPage=${currentPage}) }" />
        </th:block>
    </main>
</body>

</html>
